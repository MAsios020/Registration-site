
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border-radius: 18px;
      padding: 32px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    p {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      font-size: 14px;
      opacity: 0.8;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(0,114,255,0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Create Account</h1>
    <p>Join us in less than a minute 🚀</p>

    <form id="registerForm">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Mina Mousa" required />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="mina@email.com" required />
      </div>

      <div class="field">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="01012345678" required />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" id="btn">Create Account</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    // 👇 حط Webhook بتاع n8n هنا
    const WEBHOOK_URL = "https://v2-n8n.veemi.site/webhook/Registration";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Request failed");

        msg.textContent = "✅ Account created successfully";
        msg.className = "msg success";
        form.reset();

      } catch (err) {
        msg.textContent = "❌ Something went wrong. Try again.";
        msg.className = "msg error";
      }

      btn.disabled = false;
      btn.textContent = "Create Account";
    });
  </script>

</body>
</html>
